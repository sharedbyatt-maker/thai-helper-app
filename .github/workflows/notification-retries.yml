name: Retry queued notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notification-retries
  cancel-in-progress: false
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      # Publications send immediately. This public read only resumes existing
      # opt-in deliveries after temporary outages; it never publishes prices.
      - name: Resume queued deliveries
        env:
          RATES_API: ${{ vars.RATES_API }}
        run: |
          RATES_API="$(bash scripts/resolve_rates_api.sh)"
          curl --user-agent "Mozilla/5.0 (compatible; BahtzayNotificationRetry/1.0)" --fail --silent --show-error --max-time 25 --retry 2 "$RATES_API/api/v2/rates" --output /dev/null
