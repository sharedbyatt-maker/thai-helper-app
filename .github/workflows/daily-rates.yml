# Live directional quotes now come from /api/v2/rates, published in /admin.
# Do not generate estimated provider rates or overwrite owner-published quotes.
name: Publish currency web
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['flutter_app/**', '.github/workflows/daily-rates.yml']
permissions:
  contents: write
concurrency:
  group: currency-web-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate and build
        working-directory: flutter_app
        env:
          RATES_API: ${{ vars.RATES_API }}
        run: |
          python3 ../scripts/fetch_fonts.py
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --no-web-resources-cdn --base-href /thai-helper-app/ --dart-define=RATES_API="$RATES_API"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: flutter_app/build/web
          publish_branch: gh-pages
