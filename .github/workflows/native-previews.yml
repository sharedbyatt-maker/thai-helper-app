name: Native platform builds

# PR/master proof-of-build. A signed Android bundle is opt-in on manual runs.
on:
  workflow_dispatch:
    inputs:
      signed_android:
        description: Build a signed Android App Bundle for internal testing
        type: boolean
        default: false
  pull_request:
    paths: ['flutter_app/**', 'scripts/prepare_native_icons.py', '.github/workflows/native-previews.yml']
  push:
    branches: [master]
    paths: ['flutter_app/android/**', 'flutter_app/ios/**', 'flutter_app/lib/exchange/platform_files_native.dart', 'scripts/prepare_native_icons.py', '.github/workflows/native-previews.yml']

env:
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DART_SUPPRESS_ANALYTICS: "true"

permissions:
  contents: read

jobs:
  android-debug-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python3 scripts/fetch_fonts.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Export approved native app icons
        run: python scripts/prepare_native_icons.py
      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Build debug Android APK (not store-signed)
        working-directory: flutter_app
        run: flutter build apk --debug --dart-define=RATES_API=https://bahtzay-rates.muddyhinny2048.chatgpt.site
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: bahtzay-android-debug-preview
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios-simulator-preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python3 scripts/fetch_fonts.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Export approved native app icons
        run: python scripts/prepare_native_icons.py
      - working-directory: flutter_app
        run: flutter pub get
      - name: Build iOS Simulator app without Apple account
        working-directory: flutter_app
        run: flutter build ios --simulator --debug --dart-define=RATES_API=https://bahtzay-rates.muddyhinny2048.chatgpt.site
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: bahtzay-ios-simulator-preview
          path: flutter_app/build/ios/iphonesimulator/Runner.app
          retention-days: 7


  android-signed-internal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.signed_android
    runs-on: ubuntu-latest
    environment: android-internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install Pillow==12.3.0
          python3 scripts/fetch_fonts.py
          python3 scripts/prepare_native_icons.py
      - name: Build and verify signed Android App Bundle
        working-directory: flutter_app
        env:
          BAHTZAY_KEYSTORE_BASE64: ${{ secrets.BAHTZAY_KEYSTORE_BASE64 }}
          BAHTZAY_KEYSTORE_PASSWORD: ${{ secrets.BAHTZAY_KEYSTORE_PASSWORD }}
          BAHTZAY_KEY_ALIAS: ${{ secrets.BAHTZAY_KEY_ALIAS }}
          BAHTZAY_KEY_PASSWORD: ${{ secrets.BAHTZAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${BAHTZAY_KEYSTORE_BASE64:?Missing Android upload keystore}"
          : "${BAHTZAY_KEYSTORE_PASSWORD:?Missing Android keystore password}"
          : "${BAHTZAY_KEY_ALIAS:?Missing Android key alias}"
          : "${BAHTZAY_KEY_PASSWORD:?Missing Android key password}"
          umask 077
          export BAHTZAY_KEYSTORE_PATH="$RUNNER_TEMP/bahtzay-upload.jks"
          trap 'rm -f "$BAHTZAY_KEYSTORE_PATH"' EXIT
          printf '%s' "$BAHTZAY_KEYSTORE_BASE64" | base64 --decode > "$BAHTZAY_KEYSTORE_PATH"
          unset BAHTZAY_KEYSTORE_BASE64
          flutter build appbundle --release --dart-define=RATES_API=https://bahtzay-rates.muddyhinny2048.chatgpt.site
          bundle=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle" | tee "$RUNNER_TEMP/bahtzay-signature.txt"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/bahtzay-signature.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bahtzay-android-signed-internal
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
