name: thai_helper
description: Baht and kyat quotes, personal comparison, and exchange records.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: 1.1.0
  web: ^1.1.1
  http: ^1.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.6
  package_info_plus: 9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/bahtzay-icon-bahtzay-v2.png
    - assets/data/exchange_snapshot.json
    - assets/fonts/OFL.txt
    - assets/fonts/Symbols-OFL.txt
    - assets/fonts/UI-SYMBOLS-LICENSE.txt

  fonts:
    - family: Noto Sans Myanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar.ttf
    - family: Bahtzay UI Symbols
      fonts:
        - asset: assets/fonts/BahtzayUISymbols.ttf
    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
