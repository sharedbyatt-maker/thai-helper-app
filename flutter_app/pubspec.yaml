name: thai_helper
description: Baht and kyat quotes, personal comparison, and exchange records.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.1
  http: ^1.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/exchange_snapshot.json
    - assets/fonts/OFL.txt
    - assets/fonts/Symbols-OFL.txt

  fonts:
    - family: Noto Sans Myanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar.ttf
    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
