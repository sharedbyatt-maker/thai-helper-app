<!DOCTYPE html>
<html lang="my">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/thai-helper-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="နေ့စဉ် ဘတ် / ကျပ်ဈေးကြည့်၊ ငွေတွက်ပြီး ကိုယ့်ဝင်ငွေ၊ သုံးငွေကို စီမံနိုင်တယ်။">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sharedbyatt-maker.github.io/thai-helper-app/">
  <meta property="og:title" content="ဘတ်ဈေး — ဘတ် ↔ ကျပ်">
  <meta property="og:description" content="နေ့စဉ်ငွေဈေး၊ ငွေတွက်နဲ့ ကိုယ့်ငွေစာရင်း — ဖုန်းထဲမှာ အလွယ်တကူ သုံးနိုင်တယ်။">
  <meta property="og:image" content="https://sharedbyatt-maker.github.io/thai-helper-app/og-image-bahtzay-v2.png">

  <meta name="theme-color" content="#087F6D">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ဘတ်ဈေး — ရွှေရောင် ဘတ်သင်္ကေတနဲ့ ငွေလဲမြားနှစ်ခု">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ဘတ်ဈေး">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-bahtzay-v2.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-bahtzay-v2.png"/>

  <title>ဘတ်ဈေး</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="bahtzay-startup" role="status" aria-live="polite" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f6ef;color:#143d33;font:16px system-ui,sans-serif;text-align:center;z-index:1">
    <div style="padding:24px;max-width:360px">
      <img src="icons/Icon-192-bahtzay-v2.png" alt="ဘတ်ဈေး" width="80" height="80" style="border-radius:20px" onerror="this.hidden=true">
      <h1 style="font-size:24px">ဘတ်ဈေး</h1>
      <p id="startup-message">ဖွင့်နေပါတယ်… / Loading…</p>
      <button id="startup-retry" hidden onclick="location.reload()" style="min-height:48px;padding:12px 24px;border:0;border-radius:12px;background:#087f6d;color:white;font:inherit">ပြန်စမ်းမယ် / Retry</button>
    </div>
  </div>
  <script>
    setTimeout(() => {
      const message = document.getElementById('startup-message');
      if (message && document.getElementById('startup-retry').hidden) { message.textContent = 'လိုင်းနှေးနေနိုင်ပါတယ်။ ခဏစောင့်ပါ။ / Taking longer than usual. Please wait.'; document.getElementById('startup-retry').hidden = false; }
    }, 15000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    let installPrompt;
    window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); installPrompt = event; });
    window.bahtzayInstall = async () => {
      if (!installPrompt) return false;
      const prompt = installPrompt; installPrompt = undefined;
      await prompt.prompt();
      return (await prompt.userChoice).outcome === 'accepted';
    };
  </script>
  <script src="push-client.js"></script>
  <script src="flutter_bootstrap.js?v=e73afab936ce120d" async></script>
</body>
</html>
