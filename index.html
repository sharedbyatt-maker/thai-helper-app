<html lang="my">
<head>
  <!--

  <base href="/thai-helper-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ဘတ်ဈေး — ဘတ် ↔ ကျပ် နှုန်းကြည့်၊ ကိုယ့်ဈေးဖြင့်တွက်၊ ဈေးနှိုင်းပြီး မှတ်တမ်းသိမ်းနိုင်သည်။">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sharedbyatt-maker.github.io/thai-helper-app/">
  <meta property="og:title" content="ဘတ်ဈေး — ဘတ် ↔ ကျပ်">
  <meta property="og:description" content="နေ့စဉ်နှုန်းကြည့်ပြီး ဘတ် ↔ ကျပ် ကိုယ့်ဈေးနှင့် တွက်နိုင်သည်။">
  <meta property="og:image" content="https://sharedbyatt-maker.github.io/thai-helper-app/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ဘတ်ဈေး">

  <!-- Favicon -->

  <title>ဘတ်ဈေး — ဘတ် ↔ ကျပ်</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    let installPrompt;
    window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); installPrompt = event; });
    window.bahtzayInstall = async () => {
      if (!installPrompt) return false;
      const prompt = installPrompt; installPrompt = undefined;
      await prompt.prompt();
      return (await prompt.userChoice).outcome === 'accepted';
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
